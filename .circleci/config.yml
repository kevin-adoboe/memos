version: 2.1

functions:
  go: github.com/circleci-functions/setup-go@v0.7.0
  node: github.com/circleci-functions/setup-node@v0.4.0

jobs:
  backend:
    docker:
      - image: cimg/base:stable
    resource_class: large
    environment:
      # Run store tests against SQLite only; MySQL/PostgreSQL need Docker (testcontainers).
      DRIVER: sqlite
    steps:
      - checkout
      - go:
          with:
            version-file: go.mod
            golangci-lint-cache: true
            checksum: '{{ checksum "go.sum" }}'
      - run:
          name: Install golangci-lint
          command: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
      - run:
          name: Build
          command: go build ./...
      - run:
          name: Test (store)
          command: circleci testsuite run "backend store"
      - run:
          name: Test (race)
          command: circleci testsuite run "backend"
      - run:
          name: Verify go.mod is tidy
          command: |
            go mod tidy
            git diff --exit-code
      - run:
          name: Verify go fix
          command: go fix -diff ./...
      - run:
          name: Lint
          command: '"$(go env GOPATH)/bin/golangci-lint" run --timeout=3m'

  frontend:
    docker:
      - image: cimg/base:stable
    resource_class: large
    steps:
      - checkout
      - node:
          with:
            node-version: "24"
      - node/install-packages:
          with:
            app-dir: web
      - run:
          name: Build
          working_directory: web
          command: pnpm build
      - run:
          name: Test
          working_directory: web
          command: circleci testsuite run "frontend"
      - run:
          name: Lint
          working_directory: web
          command: pnpm lint

workflows:
  ci:
    jobs:
      - backend
      - frontend
